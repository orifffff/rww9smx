<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>8848 Community · человеческий портрет</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 16px/1.5 -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    background: #f6f7f9; color: #1c1e21; padding: 24px;
  }
  p { max-width: 340px; text-align: center; color: #6b7280; }
  @media (prefers-color-scheme: dark) {
    body { background: #14161a; color: #e7e9ee; }
    p { color: #98a2b3; }
  }
</style>
</head>
<body>
<p id="s">открываю…</p>
<script>
(async () => {
  const status = document.getElementById("s");
  const fail = (m) => { status.textContent = m; };
  if (!crypto.subtle || !("DecompressionStream" in window)) {
    return fail("нужен современный браузер: Chrome, Safari или Firefox");
  }
  const part = location.hash.slice(1);
  if (!part) return fail("ссылка неполная: не хватает части после #");
  try {
    const key = Uint8Array.from(
      atob(part.replace(/-/g, "+").replace(/_/g, "/")),
      (c) => c.charCodeAt(0),
    );
    const res = await fetch("d.bin", { cache: "no-store" });
    if (!res.ok) throw new Error("net");
    const data = new Uint8Array(await res.arrayBuffer());
    const aes = await crypto.subtle.importKey("raw", key, "AES-GCM", false, ["decrypt"]);
    const packed = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: data.slice(0, 12) }, aes, data.slice(12),
    );
    const html = await new Response(
      new Blob([packed]).stream().pipeThrough(new DecompressionStream("gzip")),
    ).text();
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    fail(e.message === "net"
      ? "файл не скачался, проверь связь и обнови страницу"
      : "не открылось: проверь, что ссылка скопирована целиком, с частью после #");
  }
})();
</script>
</body>
</html>
